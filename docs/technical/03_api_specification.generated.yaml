            type: string
          - type: 'null'
          title: Entity Id
        entity_type:
          title: Entity Type
          type: string
        id:
          title: Id
          type: integer
        is_sensitive:
          title: Is Sensitive
          type: boolean
        new_values:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: New Values
        old_values:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Old Values
        organization_id:
          format: uuid
          title: Organization Id
          type: string
        user_id:
          anyOf:
