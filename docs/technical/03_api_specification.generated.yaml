          title: Id
          type: string
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        organization_id:
          format: uuid
          title: Organization Id
          type: string
        partner_organization_id:
          format: uuid
          title: Partner Organization Id
          type: string
        period_end:
          format: date
          title: Period End
          type: string
        period_start:
          format: date
          title: Period Start
          type: string
