      properties:
        items:
          items:
            $ref: '#/components/schemas/TimelineEvent'
          title: Items
          type: array
      required:
      - items
      title: Timeline
      type: object
    TimelineEvent:
      description: 'One row in the orphan timeline. `kind` tells the frontend how to

        interpret the entity_id; `summary` is a small human-readable hint.'
      properties:
        amount:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Amount
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
        entity_id:
          format: uuid
          title: Entity Id
          type: string
        kind:
          enum:
          - sponsorship
          - payment
          - report
          - media
          title: Kind
          type: string
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        summary:
          title: Summary
          type: string
        when:
          format: date-time
          title: When
          type: string
      required:
      - when
      - kind
      - entity_id
      - summary
      title: TimelineEvent
      type: object
    TokenPair:
      properties:
        access_token:
