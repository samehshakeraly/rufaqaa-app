          type: string
        refresh_token:
          title: Refresh Token
          type: string
        token_type:
          default: bearer
          title: Token Type
          type: string
      required:
      - access_token
      - refresh_token
      title: TokenPair
      type: object
    TwoFAEnrollResponse:
      description: 'Returned by /auth/2fa/enroll.


        The shared secret is base32-encoded and the otpauth_uri is suitable

        for rendering as a QR code in the client (e.g. Google Authenticator,

        Authy, 1Password).'
      properties:
        otpauth_uri:
          title: Otpauth Uri
          type: string
        secret:
          title: Secret
          type: string
      required:
      - secret
      - otpauth_uri
      title: TwoFAEnrollResponse
      type: object
