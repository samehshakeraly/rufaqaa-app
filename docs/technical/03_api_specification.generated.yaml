    ChannelProgress:
      description: 'Goal-vs-achieved snapshot for a marketing channel''s annual targets.


        `achieved_count` counts non-cancelled sponsorships acquired through the

        channel within `goal_year`; `achieved_amount` sums completed payments on

        those channel''s sponsorships in the same year. Monthly figures track the

        current calendar month against the (annual / 12) target.'
      properties:
        achieved_amount:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Achieved Amount
          type: string
        achieved_count:
          title: Achieved Count
          type: integer
        annual_goal_amount:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Annual Goal Amount
        annual_goal_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Annual Goal Count
        channel_id:
          format: uuid
          title: Channel Id
          type: string
        completion_percentage_amount:
          title: Completion Percentage Amount
          type: number
        completion_percentage_count:
          title: Completion Percentage Count
          type: number
        goal_currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Goal Currency
        goal_year:
          title: Goal Year
          type: integer
        monthly_achieved_amount:
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Monthly Achieved Amount
          type: string
        monthly_achieved_count:
          title: Monthly Achieved Count
          type: integer
        monthly_goal_amount:
          anyOf:
          - pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
            type: string
          - type: 'null'
          title: Monthly Goal Amount
        monthly_goal_count:
          anyOf:
          - type: number
          - type: 'null'
          title: Monthly Goal Count
      required:
      - channel_id
      - goal_year
      - achieved_count
      - achieved_amount
      - completion_percentage_count
      - completion_percentage_amount
      - monthly_achieved_count
      - monthly_achieved_amount
      title: ChannelProgress
      type: object
