    SponsorshipUpdate:
      description: 'Partial update. Status changes go through dedicated /pause and

        /resume endpoints — leaving the cancel/complete transitions on

        their own routes so each one can keep its specific guard logic.'
      properties:
        end_date:
          anyOf:
          - format: date
