          title: Backup Codes
          type: array
      required:
      - backup_codes
      title: BackupCodesResponse
      type: object
    BankTransferConfirmReceipt:
      description: 'Body of POST /bank-transfers/{id}/confirm-receipt.


        Optional `confirmation_document_id` attaches an existing document

        (proof of receipt) — see `POST /documents`. Optional `notes` lets

        the operator add a free-text reason / context.'
      properties:
        confirmation_document_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Confirmation Document Id
        notes:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          title: Notes
      title: BankTransferConfirmReceipt
      type: object
    BankTransferCreate:
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,13}|(?=[\d.]{1,16}0*$)\d{0,13}\.\d{0,2}0*$)
            type: string
          title: Amount
        bank_name:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Bank Name
        bank_reference:
          anyOf:
          - maxLength: 255
            type: string
          - type: 'null'
          title: Bank Reference
        currency:
          maxLength: 3
          minLength: 3
          title: Currency
          type: string
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        partner_organization_id:
          format: uuid
          title: Partner Organization Id
          type: string
        period_end:
          format: date
          title: Period End
          type: string
        period_start:
          format: date
          title: Period Start
          type: string
      required:
      - partner_organization_id
      - amount
      - currency
      - period_start
      - period_end
      title: BankTransferCreate
      type: object
