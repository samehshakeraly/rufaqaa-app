      properties:
        code:
          maxLength: 8
          minLength: 6
          pattern: ^\d+$
          title: Code
          type: string
      required:
      - code
      title: TwoFAVerifyRequest
      type: object
    UserAdminRead:
      description: 'Lean user payload for the admin list view — never includes the

        password hash or the 2FA secret.'
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          format: email
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        id:
          format: uuid
          title: Id
          type: string
        last_login_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Login At
        last_name:
          title: Last Name
          type: string
        role:
          title: Role
          type: string
        status:
          title: Status
          type: string
        two_factor_enabled:
          title: Two Factor Enabled
          type: boolean
      required:
      - id
      - email
      - first_name
      - last_name
      - role
      - status
      - two_factor_enabled
      - last_login_at
      - created_at
      title: UserAdminRead
      type: object
    UserInvite:
      properties:
        email:
          format: email
          title: Email
          type: string
        first_name:
          maxLength: 100
          minLength: 1
          title: First Name
          type: string
        last_name:
          maxLength: 100
          minLength: 1
          title: Last Name
          type: string
        role:
          maxLength: 50
          minLength: 1
          title: Role
          type: string
      required:
      - email
      - first_name
      - last_name
      - role
      title: UserInvite
      type: object
    UserInviteResponse:
      properties:
        expires_in_days:
          title: Expires In Days
          type: integer
        invite_token:
          title: Invite Token
          type: string
        user:
          $ref: '#/components/schemas/UserAdminRead'
      required:
      - user
      - invite_token
      - expires_in_days
      title: UserInviteResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    OAuth2PasswordBearer:
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/auth/login
      type: oauth2
info:
  title: Rufaqaa API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/audit:
    get:
      operationId: list_audit_api_v1_audit_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: entity_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Type
      - in: query
        name: entity_id
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Entity Id
      - in: query
        name: action
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AuditLogRead_'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: List Audit
      tags:
      - audit
  /api/v1/auth/2fa/disable:
    post:
      operationId: disable_2fa_api_v1_auth_2fa_disable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAVerifyRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Disable 2Fa
      tags:
      - auth
  /api/v1/auth/2fa/enroll:
    post:
      operationId: enroll_2fa_api_v1_auth_2fa_enroll_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFAEnrollResponse'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Enroll 2Fa
      tags:
      - auth
  /api/v1/auth/2fa/verify:
    post:
      operationId: verify_2fa_api_v1_auth_2fa_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFAVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupCodesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Verify 2Fa
      tags:
      - auth
  /api/v1/auth/change-password:
    post:
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Change Password
      tags:
      - auth
  /api/v1/auth/forgot-password:
    post:
      description: 'Mint a short-lived password-reset token and (eventually) email it.


        Always returns the same response shape regardless of whether the

        address belongs to a real account, so the endpoint can''t be used to

        enumerate users. In non-production environments the freshly minted

        token is included as `debug_token` so the flow is testable without

        an SMTP transport.'
      operationId: forgot_password_api_v1_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Forgot Password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Revoke a single refresh token (the device's session).
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      summary: Me
      tags:
      - auth
  /api/v1/auth/me/notifications:
    patch:
      description: 'Partial update: only the keys you send are touched. Unsent

        channels keep their current value.'
