components:
  schemas:
    AcceptInvite:
      properties:
        password:
          maxLength: 128
          minLength: 8
          title: Password
          type: string
        token:
          title: Token
          type: string
      required:
      - token
      - password
      title: AcceptInvite
      type: object
    AdminInitiateOnBehalf:
      description: 'The admin sits with a present-but-digitally-unable donor, picks

        them from the existing donor records, and starts a hosted checkout

        that the donor pays right now on a screen or their own phone.'
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,8}|(?=[\d.]{1,11}0*$)\d{0,8}\.\d{0,2}0*$)
            type: string
          title: Amount
        currency:
          maxLength: 3
          minLength: 3
          title: Currency
          type: string
        donor_id:
          format: uuid
          title: Donor Id
          type: string
        language:
          default: ar
          enum:
          - ar
          - en
          title: Language
          type: string
        orphan_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Orphan Id
        sponsorship_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Sponsorship Id
      required:
      - donor_id
      - amount
      - currency
      title: AdminInitiateOnBehalf
      type: object
    AssignChannelPayload:
      description: Pass channel_id=null to unassign.
      properties:
        channel_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Channel Id
      required:
      - channel_id
      title: AssignChannelPayload
      type: object
