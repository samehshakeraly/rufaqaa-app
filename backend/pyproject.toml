[project]
name = "rufaqaa-backend"
version = "0.1.0"
description = "Rufaqaa Platform — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rufaqaa Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.3",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "redis>=5.1.0",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "PyYAML>=6.0.2",
    "boto3>=1.35.0",
    "sentry-sdk[fastapi,sqlalchemy,celery]>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.28.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Tests use dynamic fixtures (monkeypatch, dict payloads from JSON,
# fastapi.TestClient.json() returning Any) where strict typing creates
# more noise than value. They still run through `ruff` and pytest in
# CI; the strict gate guards production code.
exclude = ["migrations/", "tests/"]

# Third-party libraries that ship without type stubs / py.typed. These
# packages are dynamically typed at runtime; ignoring missing imports
# here is preferable to writing a wall of `# type: ignore` at each call
# site. Revisit when upstream publishes types.
[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "boto3",
    "botocore",
    "botocore.*",
    "jose",
    "jose.*",
    "passlib",
    "passlib.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
