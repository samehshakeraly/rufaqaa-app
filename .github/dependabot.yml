# ═══════════════════════════════════════════════════════════════
# Rufaqaa Platform — Dependabot Configuration
# ═══════════════════════════════════════════════════════════════
# Automatically check for dependency updates weekly
# https://docs.github.com/code-security/dependabot
# ═══════════════════════════════════════════════════════════════

version: 2

updates:
  # ─── GitHub Actions ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kuwait
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope

  # ─── Docker Compose (Postgres, Redis, etc.) ──────────────
  - package-ecosystem: docker
    directory: /infrastructure/docker/postgres
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

