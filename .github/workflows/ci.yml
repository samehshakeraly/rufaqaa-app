# ═══════════════════════════════════════════════════════════════
# Rufaqaa Platform — Continuous Integration
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Validate repository structure ─────────────────────────
  structure:
    name: 📁 Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
            ".editorconfig"
            "docker-compose.yml"
            ".env.example"
            "Makefile"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=1
            else
              echo "✅ Found:   $file"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "::error::Required files are missing"
            exit 1
          fi

  # ─── Validate Docker Compose ──────────────────────────────
  docker-compose:
    name: 🐳 Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env for compose
        # docker-compose.yml references env_file: .env, which is
        # gitignored. Use the committed example as a stand-in just for
        # the config-syntax check.
        run: cp .env.example .env
      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

  # ─── Validate SQL schema ──────────────────────────────────
  sql-schema:
    name: 🗄️  SQL Schema Syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      - name: Apply schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test_schema \
            -f docs/technical/01_database_schema.sql \
            -v ON_ERROR_STOP=1

  # ─── Backend: lint + tests ────────────────────────────────
  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: rufaqaa
          POSTGRES_PASSWORD: rufaqaa_dev_password
          POSTGRES_DB: rufaqaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://rufaqaa:rufaqaa_dev_password@localhost:5432/rufaqaa
      RUFAQAA_TEST_DATABASE_URL: postgresql+asyncpg://rufaqaa:rufaqaa_dev_password@localhost:5432/rufaqaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: OpenAPI export is up to date
        run: python -m app.scripts.export_openapi --check

  # ─── MCP Server: lint + tests (no backend required) ──────
  mcp:
    name: 🤖 MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check rufaqaa_mcp tests
      - name: Run tests
        run: pytest -q

  # ─── Frontend: lint + typecheck + tests + build ───────────
  frontend:
    name: ⚛️  Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm test
      - name: Build (Vite)
        run: npm run build

  # ─── Validate OpenAPI spec ────────────────────────────────
  openapi:
    name: 🌐 OpenAPI Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI YAML
        run: |
          if [ -f docs/technical/03_api_specification.yaml ]; then
            npx --yes @redocly/cli@latest lint \
              docs/technical/03_api_specification.yaml || true
          fi

  # ─── Docker images: build verification ────────────────────
  docker-images:
    name: 🐋 Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            rufaqaa-${{ matrix.service }}:${{ github.sha }}
            rufaqaa-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── Markdown linting ─────────────────────────────────────
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken internal links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --offline --verbose --no-progress './**/*.md'
          fail: false
        continue-on-error: true
