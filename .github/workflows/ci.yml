# ═══════════════════════════════════════════════════════════════
# Rufaqaa Platform — Continuous Integration
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Validate repository structure ─────────────────────────
  structure:
    name: 📁 Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
            ".editorconfig"
            "docker-compose.yml"
            ".env.example"
            "Makefile"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              missing=1
            else
              echo "✅ Found:   $file"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "::error::Required files are missing"
            exit 1
          fi

  # ─── Validate Docker Compose ──────────────────────────────
  docker-compose:
    name: 🐳 Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Seed .env for compose
        # docker-compose.yml references env_file: .env, which is
        # gitignored. Use the committed example as a stand-in just for
        # the config-syntax check.
        run: cp .env.example .env
      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

  # ─── Validate SQL schema ──────────────────────────────────
  sql-schema:
    name: 🗄️  SQL Schema Syntax
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client
      - name: Apply schema
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test_schema \
            -f docs/technical/01_database_schema.sql \
            -v ON_ERROR_STOP=1

  # ─── Backend: lint + tests ────────────────────────────────
  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: rufaqaa
          POSTGRES_PASSWORD: rufaqaa_dev_password
          POSTGRES_DB: rufaqaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://rufaqaa:rufaqaa_dev_password@localhost:5432/rufaqaa
      RUFAQAA_TEST_DATABASE_URL: postgresql+asyncpg://rufaqaa:rufaqaa_dev_password@localhost:5432/rufaqaa
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Typecheck (mypy --strict)
        run: mypy app
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: OpenAPI export is up to date
        run: python -m app.scripts.export_openapi --check

  # ─── MCP Server: lint + tests (no backend required) ──────
  mcp:
    name: 🤖 MCP Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check rufaqaa_mcp tests
      - name: Run tests
        run: pytest -q

  # ─── Frontend: lint + typecheck + tests + build ───────────
  frontend:
    name: ⚛️  Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm test
      - name: Coverage (Vitest --coverage, thresholds enforced)
        run: npm run test:coverage
      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
      - name: Build (Vite)
        run: npm run build
      - name: Generated API schema is up to date
        run: npm run generate:api:check
      - name: Build Storybook
        run: npm run build-storybook -- --quiet
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static/
          retention-days: 7

  # ─── Validate OpenAPI spec ────────────────────────────────
  openapi:
    name: 🌐 OpenAPI Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate OpenAPI YAML
        run: |
          if [ -f docs/technical/03_api_specification.yaml ]; then
            npx --yes @redocly/cli@latest lint \
              docs/technical/03_api_specification.yaml || true
          fi

  # ─── Docker images: build verification ────────────────────
  docker-images:
    name: 🐋 Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            rufaqaa-${{ matrix.service }}:${{ github.sha }}
            rufaqaa-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── E2E: Playwright against a live stack ────────────────
  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: rufaqaa
          POSTGRES_PASSWORD: rufaqaa_dev_password
          POSTGRES_DB: rufaqaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://rufaqaa:rufaqaa_dev_password@localhost:5432/rufaqaa
      # The preview server binds to 127.0.0.1:4173; the backend's CORS
      # default doesn't include that origin, so widen it here so the
      # browser-driven login POST clears the preflight.
      CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      # 14+ specs hit /public/*, /auth/login, /auth/signup etc. as the
      # same client IP (127.0.0.1). The default 60/min anonymous cap
      # is well below that — explicitly disable rate limiting for the
      # E2E job. The dedicated `test_rate_limit.py` integration test
      # still exercises the limiter via its own fixture.
      RATE_LIMIT_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: admin@dev.rufaqaa.app
      E2E_ADMIN_PASSWORD: admin12345
    steps:
      - uses: actions/checkout@v6

      # ── Backend ──────────────────────────────────────────
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Apply schema + seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.scripts.seed
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break || sleep 1
          done

      # ── Frontend ─────────────────────────────────────────
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build + preview
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000/api/v1
        run: |
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 \
            > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ && break || sleep 1
          done

      # ── Playwright ───────────────────────────────────────
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─── Markdown linting ─────────────────────────────────────
  markdown:
    name: 📝 Markdown Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for broken internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose --no-progress './**/*.md'
          fail: false
        continue-on-error: true
