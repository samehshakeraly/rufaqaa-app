# Reverse proxy in front of the FastAPI backend and the static
# frontend. TLS termination is intentionally out of scope here — run
# this behind a real load balancer (or add `listen 443 ssl;` + certs
# when self-hosting).

upstream rufaqaa_backend {
    server backend:8000;
}

upstream rufaqaa_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Cap request bodies (photo uploads etc) at 12 MB. Backend rejects
    # anything above its own UPLOAD_MAX_BYTES with 413, but stopping
    # oversized requests at the edge saves the upstream a hop.
    client_max_body_size 12m;

    # ─── API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://rufaqaa_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI docs / openapi
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://rufaqaa_backend;
        proxy_set_header Host $host;
    }

    # ─── SPA ───────────────────────────────────────────────
    location / {
        proxy_pass http://rufaqaa_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
